<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project — Praise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Revolve Sans';
    src: url('RevolveSans-Bold.woff2') format('woff2'),
         url('RevolveSans-Bold.woff') format('woff'),
         url('RevolveSans-Bold.otf') format('opentype');
    font-weight: 700; font-style: normal; font-display: swap;
  }
  :root {
    --black:#080807; --black-2:#111110; --black-3:#1a1a18;
    --orange:#FF5C00; --teal:#00C48C; --coral:#E8472A;
    --warm-white:#F0EDE6; --gray:#888880;
    --border:rgba(255,255,255,0.07); --border-bright:rgba(255,255,255,0.14);
    --font-display:'Revolve Sans','DM Sans',sans-serif;
    --font-body:'DM Sans',sans-serif;
    --font-mono:'DM Mono',monospace;
    --max-w: 800px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--black);color:var(--warm-white);font-family:var(--font-body);font-size:16px;line-height:1.7;overflow-x:hidden;}

  /* NAV */
  nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 48px;height:64px;background:rgba(8,8,7,0.92);backdrop-filter:blur(12px);border-bottom:0.5px solid var(--border);}
  .nav-logo{font-family:var(--font-display);font-size:22px;letter-spacing:0.06em;color:var(--warm-white);text-decoration:none;}
  .nav-logo span{color:var(--orange);}
  .nav-links{display:flex;gap:36px;align-items:center;}
  .nav-links a{font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:var(--gray);text-decoration:none;transition:color 0.2s;}
  .nav-links a:hover{color:var(--warm-white);}
  .nav-links a.active{color:var(--orange);}
  .nav-avail{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11px;color:var(--teal);letter-spacing:0.08em;}
  .avail-dot{width:6px;height:6px;border-radius:50%;background:var(--teal);animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
  /* Hamburger */
  .nav-hamburger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:8px;margin-right:-8px;-webkit-tap-highlight-color:transparent;}
  .nav-hamburger span{display:block;width:24px;height:1.5px;background:var(--warm-white);transition:all 0.3s;}
  .nav-hamburger.open span:nth-child(1){transform:translateY(6.5px) rotate(45deg);}
  .nav-hamburger.open span:nth-child(2){opacity:0;}
  .nav-hamburger.open span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg);}
  .nav-drawer{display:none;position:fixed;top:64px;left:0;right:0;bottom:0;background:var(--black);z-index:99;flex-direction:column;padding:32px 24px;border-top:0.5px solid var(--border);overflow-y:auto;}
  .nav-drawer.open{display:flex;}
  .nav-drawer a{font-family:var(--font-mono);font-size:14px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:var(--gray);text-decoration:none;padding:20px 0;border-bottom:0.5px solid var(--border);transition:color 0.2s;}
  .nav-drawer a:hover,.nav-drawer a.active{color:var(--orange);}
  .nav-drawer .drawer-avail{display:flex;align-items:center;gap:10px;padding:28px 0 0;font-family:var(--font-mono);font-size:11px;color:var(--teal);letter-spacing:0.08em;}
  @media(max-width:900px){
    nav{padding:0 24px;height:60px;}
    .nav-links{display:none;}
    .nav-hamburger{display:flex;}
    .nav-drawer{top:60px;}
  }
  @media(max-width:480px){
    nav{height:56px;padding:0 20px;}
    .nav-drawer{top:56px;padding:24px 20px;}
  }

  /* COVER IMAGE */
  .project-cover {
    padding: 56px 48px 0;
    display: flex;
    justify-content: center;
    animation: fadeIn 0.8s ease both;
  }
  .project-cover img {
    display: block;
    max-width: 820px;
    width: 100%;
    height: auto;
    object-fit: contain;
    object-position: center;
  }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

  /* META HEADER */
  .meta-header{max-width:var(--max-w);margin:0 auto;padding:52px 48px 0;animation:fadeUp 0.7s cubic-bezier(0.22,0.68,0,1) 0.1s both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

  .meta-category{font-family:var(--font-mono);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--orange);margin-bottom:14px;}
  .meta-title{font-family:var(--font-display);font-size:clamp(36px,6vw,72px);letter-spacing:0.04em;line-height:0.95;color:var(--warm-white);margin-bottom:24px;}
  .meta-headline{font-size:18px;font-weight:300;color:var(--gray);line-height:1.65;max-width:600px;margin-bottom:36px;}

  .meta-info{display:grid;grid-template-columns:repeat(3,auto);gap:40px;padding-top:28px;border-top:0.5px solid var(--border-bright);}
  .meta-info-item{}
  .meta-info-label{font-family:var(--font-mono);font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--orange);margin-bottom:5px;}
  .meta-info-value{font-size:13px;color:var(--gray);font-weight:300;line-height:1.4;}

  /* CONTENT BLOCKS */
  .case-study-body{max-width:var(--max-w);margin:0 auto;padding:0 48px 100px;}

  .block{margin-top:60px;}

  /* Text block */
  .block-text .block-heading{font-family:var(--font-display);font-size:clamp(22px,3vw,34px);letter-spacing:0.04em;color:var(--warm-white);margin-bottom:16px;}
  .block-text .block-body{font-size:16px;font-weight:300;color:var(--gray);line-height:1.8;white-space:pre-wrap;}

  /* Image block */
  .block-image{}
  .img-grid{display:grid;gap:8px;}
  .img-grid.cols-1{grid-template-columns:1fr;}
  .img-grid.cols-2{grid-template-columns:1fr 1fr;}
  .img-grid.cols-3{grid-template-columns:1fr 1fr 1fr;}
  .img-grid img{width:100%;display:block;object-fit:cover;}
  .block-caption{font-family:var(--font-mono);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--gray);margin-top:12px;text-align:center;}

  /* Image + text block */
  .block-imgtext{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;}
  .block-imgtext.img-right{direction:rtl;}
  .block-imgtext.img-right>*{direction:ltr;}
  .block-imgtext img{width:100%;display:block;object-fit:cover;}
  .block-imgtext-content{}
  .block-imgtext-heading{font-family:var(--font-display);font-size:clamp(18px,2.5vw,28px);letter-spacing:0.04em;color:var(--warm-white);margin-bottom:12px;}
  .block-imgtext-body{font-size:15px;font-weight:300;color:var(--gray);line-height:1.8;white-space:pre-wrap;}

  /* Quote block */
  .block-quote{padding:40px 48px;border-left:3px solid var(--orange);margin-left:0;}
  .block-quote-text{font-size:clamp(18px,2.8vw,28px);font-weight:300;font-style:italic;color:var(--warm-white);line-height:1.5;letter-spacing:-0.01em;}
  .block-quote-text::before{content:'"';color:var(--orange);font-style:normal;}
  .block-quote-text::after{content:'"';color:var(--orange);font-style:normal;}

  /* No case study fallback */
  .images-only{display:flex;flex-direction:column;gap:8px;margin-top:48px;}
  .images-only img{width:100%;display:block;}

  /* Footer */
  .project-footer{padding:40px 48px;border-top:0.5px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;}
  .next-project{font-family:var(--font-mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--gray);text-decoration:none;display:flex;align-items:center;gap:8px;transition:color 0.2s;}
  .next-project:hover{color:var(--warm-white);}
  .footer-copy{font-family:var(--font-mono);font-size:10px;color:var(--gray-2,#444);letter-spacing:0.08em;}

  /* Not found */
  .not-found{text-align:center;padding:120px 48px;font-family:var(--font-mono);font-size:13px;color:var(--gray);letter-spacing:0.08em;line-height:2.5;}
  .not-found a{color:var(--orange);text-decoration:none;}

  @media (max-width:900px){
    nav,footer,.meta-header,.case-study-body,.project-footer{padding-left:24px;padding-right:24px;}
    .project-cover{padding:40px 24px 0;}
    .meta-info{grid-template-columns:1fr 1fr;gap:24px;}
    .img-grid.cols-3{grid-template-columns:1fr 1fr;}
    .block-imgtext{grid-template-columns:1fr;gap:24px;}
    .block-imgtext.img-right{direction:ltr;}
    .block-quote{padding:28px 24px;}
  }
  @media (max-width:580px){
    nav{padding:0 20px;}
    .project-cover{padding:28px 20px 0;}
    .meta-header,.case-study-body,.project-footer{padding-left:20px;padding-right:20px;}
    .meta-info{grid-template-columns:1fr;gap:18px;}
    .img-grid.cols-2,.img-grid.cols-3{grid-template-columns:1fr;}
    .block-quote{padding:20px 16px;}
    .meta-title{font-size:clamp(28px,10vw,48px);}
  }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">P<span>.</span>RAISE</a>
  <div class="nav-links">
    <a href="index.html" class="active">Work</a>
    <a href="about.html">About</a>
    <a href="work-with-me.html">Work With Me</a>
    <a href="mailto:hello@karisadeyemi.com">Contact</a>
    <div class="nav-avail">
      <div class="avail-dot"></div>
      <span id="nav-avail-text">Available for work</span>
    </div>
  </div>
  <button class="nav-hamburger" id="hamburger" aria-label="Menu" onclick="toggleMenu()">
    <span></span><span></span><span></span>
  </button>
</nav>

<!-- MOBILE DRAWER -->
<div class="nav-drawer" id="nav-drawer">
  <a href="index.html" class="active" onclick="closeMenu()">Work</a>
  <a href="about.html" onclick="closeMenu()">About</a>
  <a href="work-with-me.html" onclick="closeMenu()">Work With Me</a>
  <a href="mailto:hello@karisadeyemi.com" onclick="closeMenu()">Contact</a>
  <div class="drawer-avail">
    <div style="width:6px;height:6px;border-radius:50%;background:var(--teal);animation:pulse 2s infinite;flex-shrink:0;"></div>
    <span>Available for work</span>
  </div>
</div>

<div id="page-content"></div>

<script>
  const params  = new URLSearchParams(window.location.search);
  const id      = parseInt(params.get('id'), 10);
  const projects = JSON.parse(localStorage.getItem('portfolio_projects') || '[]');
  const project  = projects.find(p => p.id === id);
  const container = document.getElementById('page-content');

  if (!project) {
    container.innerHTML = `
      <div class="not-found">
        Project not found.<br>
        <a href="index.html">← Back to portfolio</a>
      </div>`;
  } else {
    document.title = `${project.title} — Praise`;

    const cs = project.caseStudy;
    const hasCaseStudy = cs && (cs.blocks || []).length > 0;

    // Build meta info pills
    let metaInfoHtml = '';
    if (cs?.year)     metaInfoHtml += `<div class="meta-info-item"><div class="meta-info-label">Year</div><div class="meta-info-value">${cs.year}</div></div>`;
    if (cs?.client)   metaInfoHtml += `<div class="meta-info-item"><div class="meta-info-label">Client</div><div class="meta-info-value">${cs.client}</div></div>`;
    if (cs?.services) metaInfoHtml += `<div class="meta-info-item"><div class="meta-info-label">Services</div><div class="meta-info-value">${cs.services}</div></div>`;

    // Build blocks html
    let blocksHtml = '';
    if (hasCaseStudy) {
      cs.blocks.forEach(block => {
        if (block.type === 'text') {
          blocksHtml += `
            <div class="block block-text">
              ${block.heading ? `<div class="block-heading">${block.heading}</div>` : ''}
              <div class="block-body">${block.body || ''}</div>
            </div>`;
        }
        if (block.type === 'image') {
          const cols = block.layout === 'full' ? 1 : block.layout === '2col' ? 2 : 3;
          const imgs = (block.images || []).map(src => `<img src="${src}" loading="lazy" alt="">`).join('');
          blocksHtml += `
            <div class="block block-image">
              <div class="img-grid cols-${cols}">${imgs}</div>
              ${block.caption ? `<div class="block-caption">${block.caption}</div>` : ''}
            </div>`;
        }
        if (block.type === 'image-text') {
          blocksHtml += `
            <div class="block block-imgtext ${block.position === 'right' ? 'img-right' : ''}">
              <img src="${block.image}" loading="lazy" alt="">
              <div class="block-imgtext-content">
                ${block.heading ? `<div class="block-imgtext-heading">${block.heading}</div>` : ''}
                <div class="block-imgtext-body">${block.body || ''}</div>
              </div>
            </div>`;
        }
        if (block.type === 'quote') {
          blocksHtml += `
            <div class="block block-quote">
              <div class="block-quote-text">${block.text || ''}</div>
            </div>`;
        }
      });
    }

    // Next project
    const idx = projects.findIndex(p => p.id === id);
    const next = projects[(idx + 1) % projects.length];
    const nextHtml = next && next.id !== id
      ? `<a href="project.html?id=${next.id}" class="next-project">Next Project → ${next.title}</a>`
      : '';

    container.innerHTML = `
      <div class="project-cover">
        <img src="${project.image}" alt="${project.title}">
      </div>

      <div class="meta-header">
        <div class="meta-category">${project.category}</div>
        <h1 class="meta-title">${project.title}</h1>
        ${project.desc ? `<p class="meta-headline">${project.desc}</p>` : ''}
        ${metaInfoHtml ? `<div class="meta-info">${metaInfoHtml}</div>` : ''}
      </div>

      <div class="case-study-body">
        ${hasCaseStudy ? blocksHtml : '<div style="margin-top:48px;font-family:var(--font-mono);font-size:12px;color:var(--gray);letter-spacing:0.08em;">No case study added yet.</div>'}
      </div>

      <div class="project-footer">
        ${nextHtml}
        <span class="footer-copy">© 2026 Praise</span>
      </div>`;
  }
  // ── NAV ──
  const settings = JSON.parse(localStorage.getItem('portfolio_settings') || '{}');
  if (settings.avail === 'booked') {
    document.getElementById('nav-avail-text').textContent = 'Fully booked';
    document.querySelector('.avail-dot').style.background = '#E8472A';
  } else if (settings.avail === 'limited') {
    document.getElementById('nav-avail-text').textContent = 'Limited availability';
    document.querySelector('.avail-dot').style.background = '#EF9F27';
  }

  function toggleMenu() {
    const h = document.getElementById('hamburger');
    const d = document.getElementById('nav-drawer');
    h.classList.toggle('open');
    d.classList.toggle('open');
    document.body.style.overflow = d.classList.contains('open') ? 'hidden' : '';
  }
  function closeMenu() {
    document.getElementById('hamburger').classList.remove('open');
    document.getElementById('nav-drawer').classList.remove('open');
    document.body.style.overflow = '';
  }
</script>
</body>
</html>
